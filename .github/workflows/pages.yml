name: Publish website from private source

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  sync-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github
      - name: Verify and publish image packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_assets.py
  build:
    needs: sync-images
    runs-on: ubuntu-latest
    steps:
      - name: Read private website source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.WEBSITE_SOURCE_REPOSITORY }}
          ref: ${{ secrets.WEBSITE_SOURCE_REF }}
          ssh-key: ${{ secrets.WEBSITE_SOURCE_KEY }}
          persist-credentials: false
          path: website
          sparse-checkout: |
            scripts
            data
            media/previews
            media/decorations
            vendor
            assets
            releases
      - name: Apply verified source overlay
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('website').resolve()
          manifest=json.loads((root/'releases/overlay-manifest.json').read_text())
          archive=root/manifest['file']
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=manifest['sha256']:raise RuntimeError('Source overlay checksum mismatch')
          with zipfile.ZipFile(archive) as package:
              for entry in package.infolist():
                  target=(root/entry.filename).resolve()
                  if not target.is_relative_to(root):raise RuntimeError('Unsafe source path')
              package.extractall(root)
          extra=manifest.get('collection_overlay')
          if extra:
              addon=(root/extra['file']).resolve()
              if not addon.is_relative_to(root/'releases') or hashlib.sha256(addon.read_bytes()).hexdigest()!=extra['sha256']:
                  raise RuntimeError('Collection overlay verification failed')
              allowed={'prompt-collection.js','prompt-collection.css','data/prompt-collection/curated.json'}
              with zipfile.ZipFile(addon) as package:
                  if len(package.namelist())!=len(allowed) or set(package.namelist())!=allowed:
                      raise RuntimeError('Unexpected file in collection overlay')
                  package.extractall(root)
          desktop=manifest.get('desktop_gallery_overlay')
          if desktop:
              addon=(root/desktop['file']).resolve()
              if not addon.is_relative_to(root/'releases') or hashlib.sha256(addon.read_bytes()).hexdigest()!=desktop['sha256']:
                  raise RuntimeError('Desktop gallery overlay verification failed')
              allowed={'app.js','styles.css','prompt-collection.js','prompt-collection.css','data/prompt-collection/curated.json'}
              with zipfile.ZipFile(addon) as package:
                  if len(package.namelist())!=len(allowed) or set(package.namelist())!=allowed:
                      raise RuntimeError('Unexpected file in desktop gallery overlay')
                  package.extractall(root)
          full=manifest.get('full_desktop_overlay')
          if full:
              addon=(root/full['file']).resolve()
              if not addon.is_relative_to(root/'releases') or hashlib.sha256(addon.read_bytes()).hexdigest()!=full['sha256']:
                  raise RuntimeError('Full desktop overlay verification failed')
              allowed={'app.js','styles.css','account.js','support-panel.js','prompt-collection.css','tools.css','runway-studio.css','scripts/build-discovery-pages.mjs','assets/discovery/collections.css'}
              with zipfile.ZipFile(addon) as package:
                  if len(package.namelist())!=len(allowed) or set(package.namelist())!=allowed:
                      raise RuntimeError('Unexpected file in full desktop overlay')
                  package.extractall(root)
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build public website
        run: node website/scripts/build-pages.mjs --include-prepared --published-originals "$GITHUB_WORKSPACE/website/data/published-originals.json" --out "$RUNNER_TEMP/character-reference-pages"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/character-reference-pages
          retention-days: 1
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
